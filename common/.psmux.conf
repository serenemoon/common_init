# ~/.psmux.conf

# --- Plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-pain-control'
set -g @plugin 'psmux-plugins/psmux-theme-gruvbox'


# --- End Of Plugins

# 1. 将 prefix 设置为 Alt+`
set -g prefix M-`
bind-key M-` send-prefix

# 2. 解除默认的 Ctrl+B 作为 prefix
unbind-key C-b

# 3. 自定义 pane 切分
# | : 横向切分（左右） @psmux-sensible
# - : 纵向切分（上下） @psmux-sensible

# 4. 使用 Alt+1~9 切换窗口
# 注意：psmux 默认窗口编号从 0 开始，建议设为 1 以对齐你的需求
set -g base-index 1
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# 5. Alt+` 打开 choose-tree
# 在 prefix 表内绑定，按下 Alt+` 后再按 Alt+` 触发
bind-key M-` choose-session

# --- KEEP THIS LINE AT THE END OF THIS FILE --- #
run '~/.psmux/plugins/ppm/ppm.ps1'
